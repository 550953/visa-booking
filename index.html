<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Мои заявки — Личный кабинет</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/core@1.0.0-beta20/dist/css/tabler.min.css">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<div id="layout-mount"></div>

<div class="page-wrapper">
  <div class="page-header d-print-none">
    <div class="container-xl">
      <div class="row align-items-center">
        <div class="col">
          <div class="text-secondary">Личный кабинет</div>
          <h2 class="page-title">Мои заявки</h2>
        </div>
      </div>
    </div>
  </div>

  <div class="page-body">
    <div class="container-xl">

      <div class="row row-cards mb-3" id="stats-row">
        <div class="col-sm-6 col-lg-3">
          <div class="card card-sm">
            <div class="card-body">
              <div class="text-secondary">Всего заявок</div>
              <div class="h1 mb-0" id="stat-total">—</div>
              <div class="text-secondary">за всё время</div>
            </div>
          </div>
        </div>
        <div class="col-sm-6 col-lg-3">
          <div class="card card-sm">
            <div class="card-body">
              <div class="text-secondary">В работе</div>
              <div class="h1 mb-0" id="stat-progress">—</div>
              <div class="text-secondary">включая поиск слота</div>
            </div>
          </div>
        </div>
        <div class="col-sm-6 col-lg-3">
          <div class="card card-sm">
            <div class="card-body">
              <div class="text-secondary">Нужна оплата</div>
              <div class="h1 mb-0" id="stat-payment">—</div>
              <div class="text-secondary">требует вашего действия</div>
            </div>
          </div>
        </div>
        <div class="col-sm-6 col-lg-3">
          <div class="card card-sm">
            <div class="card-body">
              <div class="text-secondary">Запись найдена</div>
              <div class="h1 mb-0" id="stat-found">—</div>
              <div class="text-secondary">можно готовиться к визиту</div>
            </div>
          </div>
        </div>
      </div>

      <div id="payment-alert"></div>

      <div class="card">
        <div class="card-header">
          <h3 class="card-title">Все заявки</h3>
          <div class="card-actions">
            <select class="form-select form-select-sm" id="status-filter" style="width:auto">
              <option value="all">Все статусы</option>
              <option value="awaiting_payment">Ожидает оплаты</option>
              <option value="in_progress">В работе</option>
              <option value="slot_found">Запись найдена</option>
              <option value="draft">Черновик</option>
            </select>
            <a href="new/index.html" class="btn btn-primary ms-2">＋ Новая заявка</a>
          </div>
        </div>
        <div class="table-responsive">
          <table class="table card-table table-vcenter">
            <thead>
              <tr>
                <th>Заявка</th>
                <th>Направление</th>
                <th>Заявители</th>
                <th>Статус / оплата</th>
                <th>Стоимость</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="applications-tbody">
              <tr><td colspan="6"><div class="skeleton-line" style="width:60%"></div></td></tr>
            </tbody>
          </table>
        </div>
        <div class="card-footer text-secondary" id="table-footer"></div>
      </div>

    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@tabler/core@1.0.0-beta20/dist/js/tabler.min.js"></script>
<script src="assets/mock-data.js"></script>
<script src="assets/layout.js"></script>
<script>
  renderLayout({ active: 'overview', base: './' });

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  function render() {
    const all = CabinetData.loadApplications();
    const filter = document.getElementById('status-filter').value;
    const list = filter === 'all' ? all : all.filter((a) => a.status === filter);

    document.getElementById('stat-total').textContent = all.length;
    document.getElementById('stat-progress').textContent = all.filter((a) => a.status === 'in_progress' || a.status === 'awaiting_payment').length;
    document.getElementById('stat-payment').textContent = all.filter((a) => a.status === 'awaiting_payment').length;
    document.getElementById('stat-found').textContent = all.filter((a) => a.status === 'slot_found').length;

    const pending = all.find((a) => a.status === 'awaiting_payment');
    const alertBox = document.getElementById('payment-alert');
    if (pending) {
      alertBox.innerHTML = `
        <div class="alert alert-warning" role="alert">
          <div class="d-flex">
            <div><strong>Есть заявка, ожидающая оплаты.</strong> Выбор способа оплаты не списывает деньги — откройте заявку и подтвердите платёж только после проверки деталей.</div>
          </div>
          <div class="mt-2"><a href="application.html?id=${encodeURIComponent(pending.id)}" class="btn btn-sm btn-outline-warning">Проверить</a></div>
        </div>`;
    } else {
      alertBox.innerHTML = '';
    }

    const tbody = document.getElementById('applications-tbody');
    if (!list.length) {
      tbody.innerHTML = `<tr><td colspan="6" class="text-secondary text-center py-4">Заявок с таким статусом нет</td></tr>`;
    } else {
      tbody.innerHTML = list
        .map((a) => {
          const meta = CabinetData.STATUS_META[a.status] || CabinetData.STATUS_META.draft;
          const applicantsHtml = a.applicants
            .map((n) => `<span class="badge bg-secondary-lt">${escapeHtml(n)}</span>`)
            .join(' ');
          return `
          <tr>
            <td>
              <strong>${escapeHtml(a.id)}</strong>
              <div class="text-secondary small">${escapeHtml(a.createdLabel)}</div>
            </td>
            <td>
              <strong>${escapeHtml(a.country)}</strong>
              <div class="text-secondary small">${escapeHtml(a.visaType)}</div>
            </td>
            <td><div class="applicants-tags">${applicantsHtml}</div></td>
            <td>
              <span class="badge ${meta.badge}"><span class="status-dot ${a.status}"></span>${meta.label}</span>
              <div class="text-secondary small">${escapeHtml(a.paymentMethod)}</div>
            </td>
            <td><strong>${a.cost.toLocaleString('ru-RU')} ₽</strong></td>
            <td class="text-end">
              <a href="application.html?id=${encodeURIComponent(a.id)}" class="btn btn-sm btn-outline-primary">Открыть ›</a>
            </td>
          </tr>`;
        })
        .join('');
    }

    document.getElementById('table-footer').textContent = `Показано ${list.length} из ${all.length} заявок`;
  }

  document.getElementById('status-filter').addEventListener('change', render);
  document.addEventListener('DOMContentLoaded', render);
  render();
</script>
</body>
</html>
