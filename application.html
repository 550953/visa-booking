<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Заявка — Личный кабинет</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/core@1.0.0-beta20/dist/css/tabler.min.css">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<div id="layout-mount"></div>

<div class="page-wrapper">
  <div class="page-header d-print-none">
    <div class="container-xl">
      <div class="text-secondary"><a href="index.html">Мои заявки</a> / <span id="crumb-id">заявка</span></div>
      <h2 class="page-title" id="app-title">Заявка</h2>
    </div>
  </div>

  <div class="page-body">
    <div class="container-xl" id="content">
      <div class="skeleton-line" style="width:40%"></div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@tabler/core@1.0.0-beta20/dist/js/tabler.min.js"></script>
<script src="assets/mock-data.js"></script>
<script src="assets/layout.js"></script>
<script>
  renderLayout({ active: 'overview', base: './' });

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  const params = new URLSearchParams(window.location.search);
  const id = params.get('id');
  const app = id ? CabinetData.getApplicationById(id) : null;
  const content = document.getElementById('content');

  if (!app) {
    document.getElementById('app-title').textContent = 'Заявка не найдена';
    content.innerHTML = `
      <div class="alert alert-danger">Заявка с таким номером не найдена в этом браузере.</div>
      <a href="index.html" class="btn btn-outline-primary">← Ко всем заявкам</a>`;
  } else {
    document.getElementById('app-title').textContent = 'Заявка ' + app.id;
    document.getElementById('crumb-id').textContent = app.id;

    const meta = CabinetData.STATUS_META[app.status] || CabinetData.STATUS_META.draft;
    const applicantsHtml = app.applicants
      .map((n) => `<span class="badge bg-secondary-lt me-1 mb-1">${escapeHtml(n)}</span>`)
      .join('');

    let payAction = '';
    if (app.status === 'awaiting_payment') {
      payAction = `<button class="btn btn-success" id="confirm-pay">Подтвердить оплату</button>`;
    }

    content.innerHTML = `
      <div class="row row-cards">
        <div class="col-lg-8">
          <div class="card">
            <div class="card-header">
              <h3 class="card-title">${escapeHtml(app.country)} · ${escapeHtml(app.visaType)}</h3>
              <div class="card-actions">
                <span class="badge ${meta.badge}"><span class="status-dot ${app.status}"></span>${meta.label}</span>
              </div>
            </div>
            <div class="card-body">
              <div class="mb-3">
                <div class="text-secondary">Заявители</div>
                <div class="mt-1">${applicantsHtml}</div>
              </div>
              <div class="row">
                <div class="col-6">
                  <div class="text-secondary">Способ оплаты</div>
                  <div>${escapeHtml(app.paymentMethod)}</div>
                </div>
                <div class="col-6">
                  <div class="text-secondary">Стоимость</div>
                  <div><strong>${app.cost.toLocaleString('ru-RU')} ₽</strong></div>
                </div>
              </div>
              <div class="mt-3">
                <div class="text-secondary">Создана</div>
                <div>${escapeHtml(app.createdLabel)}</div>
              </div>
            </div>
            <div class="card-footer d-flex">
              ${payAction}
              <a href="index.html" class="btn btn-link ms-auto">← Ко всем заявкам</a>
            </div>
          </div>
        </div>
        <div class="col-lg-4">
          <div class="card">
            <div class="card-body">
              <div class="text-secondary mb-2">Нужна помощь?</div>
              <a href="mailto:support@example.com" class="btn btn-outline-primary w-100">Написать в поддержку →</a>
            </div>
          </div>
        </div>
      </div>
    `;

    const payBtn = document.getElementById('confirm-pay');
    if (payBtn) {
      payBtn.addEventListener('click', () => {
        CabinetData.updateApplication(app.id, { status: 'in_progress' });
        window.location.reload();
      });
    }
  }
</script>
</body>
</html>
