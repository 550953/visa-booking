<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="Полная карточка клиента Booking Ops." /><title>Карточка клиента — Booking Ops</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/core@1.0.0-beta20/dist/css/tabler.min.css" /><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.47.0/tabler-icons.min.css" /><link rel="stylesheet" href="assets/style.css" />
  </head>
  <body data-page="clients" data-title="Карточка клиента">
    <div class="page"><aside class="navbar navbar-vertical navbar-expand-lg navbar-dark" data-bs-theme="dark"><div class="container-fluid"><button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#sidebar-menu" aria-label="Открыть меню"><span class="navbar-toggler-icon"></span></button><div class="collapse navbar-collapse" id="sidebar-menu"><div id="bop-sidebar"></div></div></div></aside>
      <div class="page-wrapper"><header class="navbar navbar-expand-md d-none d-md-flex d-print-none bop-topbar"><div class="container-xl" id="bop-topbar"></div></header>
        <main class="page-body"><div class="container-xl"><div class="d-flex align-items-center justify-content-between mb-3 gap-3 flex-wrap"><div><a href="clients.html" class="text-secondary small"><i class="ti ti-arrow-left"></i> Все клиенты</a><div class="bop-page-note">Все действия по заявке собраны в одной карточке</div></div><div class="btn-list"><button class="btn btn-outline-secondary" id="edit-toggle"><i class="ti ti-edit me-1"></i>Редактировать</button><button class="btn btn-outline-secondary" id="authorize-btn"><i class="ti ti-key me-1"></i>Авторизовать аккаунт</button><button class="btn btn-primary" id="start-btn"><i class="ti ti-player-play me-1"></i>Запустить мониторинг</button></div></div><div id="client-content"></div></div></main>
        <footer class="footer footer-transparent d-print-none"><div class="container-xl text-secondary small">Booking Ops · карточка клиента · статические демо-данные</div></footer>
      </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/@tabler/core@1.0.0-beta20/dist/js/tabler.min.js"></script><script src="assets/mock-data.js"></script><script src="assets/layout.js"></script><script src="assets/app.js"></script>
    <script>
      (function () {
        var M = window.BOP_MOCK, id = new URLSearchParams(window.location.search).get("id") || "CL-1042", content = document.getElementById("client-content");
        function client() { return window.BOP_APP.clients().find(function (item) { return item.id === id; }) || window.BOP_APP.clients()[0]; }
        function value(key) { return window.BOP_APP.escapeHtml(client()[key] || "—"); }
        function render() {
          var c = client(), initials = c.name.split(" ").map(function (x) { return x[0]; }).slice(0, 2).join(""), events = (M.EVENTS || []).filter(function (event) { return event.clientId === c.id; }), needsAction = ["slot_found", "captcha", "payment", "payment_error", "error", "video", "confirmation"].indexOf(c.status) !== -1;
          content.innerHTML = '<div class="row row-cards"><div class="col-lg-8"><article class="card mb-3"><div class="card-body"><div class="d-flex align-items-start gap-3"><span class="avatar avatar-lg bg-blue-lt">' + initials + '</span><div class="flex-fill"><div class="d-flex align-items-center gap-2 flex-wrap"><h2 class="h2 mb-1">' + value("name") + '</h2>' + M.statusBadge(c.status) + '</div><div class="text-secondary">' + value("id") + ' · создана ' + value("createdAt") + '</div></div><span class="bop-demo-badge">демо</span></div><div class="row g-3 mt-3"><div class="col-sm-4"><div class="bop-section-label">Приоритет</div><select class="form-select form-select-sm mt-1" id="priority-field"><option value="high" ' + (c.priority === "high" ? "selected" : "") + '>Высокий</option><option value="normal" ' + (c.priority === "normal" ? "selected" : "") + '>Обычный</option><option value="low" ' + (c.priority === "low" ? "selected" : "") + '>Низкий</option></select></div><div class="col-sm-4"><div class="bop-section-label">Последняя проверка</div><div class="mt-2 fw-semibold">' + value("lastCheck") + '</div></div><div class="col-sm-4"><div class="bop-section-label">Прокси</div><div class="mt-2 fw-semibold">' + value("proxy") + '</div></div></div></div></article><form id="client-form"><article class="card mb-3"><div class="card-header"><h3 class="card-title">Общие сведения и контакты</h3></div><div class="card-body bop-form"><div class="row g-3"><div class="col-md-6"><label class="form-label">ФИО</label><input class="form-control" name="name" value="' + value("name") + '" /></div><div class="col-md-6"><label class="form-label">Дата рождения</label><input class="form-control" name="birthDate" value="' + value("birthDate") + '" /></div><div class="col-md-6"><label class="form-label">Телефон</label><input class="form-control" name="phone" value="' + value("phone") + '" /></div><div class="col-md-6"><label class="form-label">Email</label><input class="form-control" name="email" type="email" value="' + value("email") + '" /></div><div class="col-md-6"><label class="form-label">Страна подачи</label><select class="form-select" name="country"><option value="ES" ' + (c.country === "ES" ? "selected" : "") + '>Испания</option><option value="FR" ' + (c.country === "FR" ? "selected" : "") + '>Франция</option><option value="IT" ' + (c.country === "IT" ? "selected" : "") + '>Италия</option></select></div><div class="col-md-6"><label class="form-label">Тип визы</label><select class="form-select" name="visaType"><option ' + (c.visaType === "Туристическая" ? "selected" : "") + '>Туристическая</option><option ' + (c.visaType === "Деловая" ? "selected" : "") + '>Деловая</option><option ' + (c.visaType === "Студенческая" ? "selected" : "") + '>Студенческая</option></select></div></div></div></article><article class="card mb-3"><div class="card-header"><h3 class="card-title">Паспортные данные</h3></div><div class="card-body bop-form"><div class="row g-3"><div class="col-md-6"><label class="form-label">Номер паспорта</label><input class="form-control" name="passport" value="' + value("passport") + '" /></div><div class="col-md-6"><label class="form-label">Дата окончания</label><input class="form-control" name="passportExpires" value="' + value("passportExpires") + '" /></div><div class="col-md-6"><label class="form-label">Фото</label><div class="form-control-plaintext text-green"><i class="ti ti-circle-check me-1"></i>Загружено · passport-photo.jpg</div></div></div></div></article><article class="card mb-3"><div class="card-header"><h3 class="card-title">Видео и платежные данные</h3></div><div class="card-body"><div class="row g-3"><div class="col-md-6"><div class="bop-section-label">Видео для Испании</div><div class="mt-2"><span class="badge bg-purple-lt text-purple">' + value("videoState") + '</span> <span class="text-secondary small">' + value("video") + '</span></div></div><div class="col-md-6"><div class="bop-section-label">Платежные данные</div><div class="mt-2"><span class="badge bg-blue-lt text-blue">' + value("paymentState") + '</span><div class="text-secondary small mt-1">CVV не хранится в прототипе</div></div></div></div></div></article><div class="d-flex justify-content-end mb-3"><button class="btn btn-primary" type="submit"><i class="ti ti-device-floppy me-1"></i>Сохранить изменения</button></div></form><article class="card"><div class="card-header bop-card-header"><h3 class="card-title mb-0">История действий</h3><a class="small" href="logs.html?client=' + c.id + '">Открыть отдельный журнал <i class="ti ti-arrow-up-right"></i></a></div><div class="card-body"><ul class="bop-timeline">' + (events.length ? events : [{ time: "сегодня", message: "Карточка создана", level: "info" }]).map(function (event) { return '<li><span class="bop-timeline-dot"></span><div><div class="fw-semibold">' + window.BOP_APP.escapeHtml(event.message || event.title) + '</div><div class="text-secondary small mt-1">' + event.time + ' · ' + (event.source || "Operator") + ' · ' + (event.result || "Инфо") + '</div></div></li>'; }).join("") + '</ul></div></article></div><div class="col-lg-4"><article class="card mb-3"><div class="card-header"><h3 class="card-title">Состояние аккаунта</h3></div><div class="card-body"><div class="bop-status-panel ' + (c.authState === "Авторизован" ? "is-success" : "is-danger") + ' p-3"><div class="d-flex align-items-center gap-2"><span class="bop-dot ' + (c.authState === "Авторизован" ? "bop-dot-green" : "bop-dot-red") + '"></span><strong>' + value("authState") + '</strong></div><div class="text-secondary small mt-2">Аккаунт визового центра используется только для ' + M.countryName(c.country) + '.</div><button class="btn btn-sm btn-outline-primary mt-3 w-100" id="reauth-btn">Авторизовать / обновить сессию</button></div></div></article><article class="card mb-3" id="current-action"><div class="card-header"><h3 class="card-title">Текущее действие</h3></div><div class="card-body"><div class="bop-status-panel ' + (needsAction ? "is-warning" : "") + ' p-3"><div class="fw-semibold">' + (c.status === "slot_found" ? "Подтвердить найденный слот" : c.status === "captcha" ? "Решить CAPTCHA" : c.status === "payment" ? "Подтвердить оплату" : c.status === "error" ? "Запустить повтор" : c.status === "video" ? "Загрузить видео" : c.status === "confirmation" ? "Проверить подтверждение" : "Действие не требуется") + '</div><div class="bop-action-hint text-secondary small mt-2">' + window.BOP_APP.actionHint(c.status) + '</div>' + (c.status === "slot_found" ? '<div class="bop-slot-summary mt-3"><div class="bop-section-label">Найденное окно</div><div class="d-flex justify-content-between gap-2 mt-2"><strong>' + window.BOP_APP.escapeHtml(c.slotDate || "18.08.2026") + '</strong><strong>' + window.BOP_APP.escapeHtml(c.slotTime || "09:00") + '</strong></div><div class="text-secondary small mt-1">' + window.BOP_APP.escapeHtml(c.slotCenter || M.countryName(c.country)) + ' · слот удерживается 10 минут</div></div>' : "") + (c.status === "error" ? '<div class="alert alert-danger mt-3 mb-0 py-2"><strong>Причина:</strong> ' + window.BOP_APP.escapeHtml(c.authError || "Сессия аккаунта истекла") + '<br><strong>Что делать:</strong> ' + window.BOP_APP.escapeHtml(c.authRecommendation || "Повторите авторизацию и проверьте результат.") + '</div>' : "") + (c.status === "payment" ? '<div class="mt-3"><label class="form-label small fw-semibold" for="demo-cvv">CVV для подтверждения</label><input class="form-control" id="demo-cvv" inputmode="numeric" maxlength="4" placeholder="Введите только перед подтверждением" autocomplete="off"><div class="text-secondary small mt-1"><i class="ti ti-lock me-1"></i>Поле очищается после действия и не сохраняется.</div></div>' : "") + (c.status === "video" ? '<div class="mt-3"><label class="form-label small fw-semibold" for="demo-video">Файл видео</label><input class="form-control" id="demo-video" type="file" accept="video/*"><div class="text-secondary small mt-1">После выбора нажмите «Загрузить видео».</div></div>' : "") + '<button class="btn btn-sm btn-primary mt-3 w-100" id="action-btn">' + (needsAction ? window.BOP_APP.actionLabel(c.status) : "Поставить на паузу") + '</button></div></div></article><article class="card mb-3"><div class="card-header"><h3 class="card-title">Подтверждение записи</h3></div><div class="card-body"><div class="text-secondary small">Файл связан с карточкой клиента</div><div class="fw-semibold mt-2">' + value("confirmation") + '</div><button class="btn btn-sm btn-outline-secondary mt-3 w-100" id="download-confirmation"><i class="ti ti-download me-1"></i>Скачать подтверждение</button></div></article><article class="card"><div class="card-header"><h3 class="card-title">Управление карточкой</h3></div><div class="card-body d-grid gap-2"><button class="btn btn-outline-warning" id="pause-btn"><i class="ti ti-player-pause me-1"></i>' + (c.status === "paused" ? "Возобновить мониторинг" : "Приостановить клиента") + '</button><button class="btn btn-outline-danger" id="delete-btn"><i class="ti ti-trash me-1"></i>Удалить карточку</button></div></article></div></div>';
          bind(c);
        }
        function bind(c) {
          document.getElementById("client-form").addEventListener("submit", function (event) { event.preventDefault(); var data = Object.fromEntries(new FormData(event.target).entries()); window.BOP_APP.updateClient(id, data); window.BOP_APP.updateClient(id, { priority: document.getElementById("priority-field").value }); window.BOP_APP.toast("Изменения сохранены"); render(); });
          document.getElementById("authorize-btn").addEventListener("click", authorize); document.getElementById("reauth-btn").addEventListener("click", authorize);
          document.getElementById("start-btn").addEventListener("click", function () { window.BOP_APP.updateClient(id, { status: "monitoring", authState: "Авторизован" }); window.BOP_APP.toast("Клиент переведён в мониторинг"); render(); });
          document.getElementById("action-btn").addEventListener("click", function () { var cvv = document.getElementById("demo-cvv"); if (c.status === "payment" && (!cvv || !cvv.value.trim())) { cvv && cvv.focus(); window.BOP_APP.toast("Введите CVV для подтверждения оплаты"); return; } var next = window.BOP_APP.nextActionStatus(c.status), patch = { status: next, confirmation: next === "success" ? "booking-" + id + ".pdf" : c.confirmation }; if (c.status === "payment") patch.paymentState = "Подтверждены"; if (c.status === "captcha") patch.authError = ""; if (c.status === "video") patch.videoState = "Загружено"; if (cvv) cvv.value = ""; window.BOP_APP.updateClient(id, patch); window.BOP_APP.toast("Действие выполнено: " + M.STATUSES[next].label); render(); });
          document.getElementById("pause-btn").addEventListener("click", function () { window.BOP_APP.updateClient(id, { status: c.status === "paused" ? "monitoring" : "paused" }); window.BOP_APP.toast(c.status === "paused" ? "Мониторинг возобновлён" : "Клиент приостановлен"); render(); });
          document.getElementById("download-confirmation").addEventListener("click", function () { var blob = new Blob(["Booking Ops\\nПодтверждение записи\\nКлиент: " + c.name + "\\nID: " + c.id + "\\nСтрана: " + M.countryName(c.country) + "\\nСтатус: " + M.STATUSES[c.status].label], { type: "text/plain;charset=utf-8" }); var link = document.createElement("a"); link.href = URL.createObjectURL(blob); link.download = (c.confirmation === "—" ? c.id : c.confirmation).replace(".pdf", "") + ".txt"; link.click(); window.BOP_APP.toast("Демо-подтверждение скачано"); });
          document.getElementById("delete-btn").addEventListener("click", function () { if (!window.confirm("Удалить карточку?")) return; window.BOP_APP.saveClients(window.BOP_APP.clients().filter(function (item) { return item.id !== id; })); window.location.href = "clients.html"; });
          document.getElementById("edit-toggle").addEventListener("click", function () { document.getElementById("client-form").scrollIntoView({ behavior: "smooth" }); document.querySelector('#client-form input[name="name"]').focus(); });
        }
        function authorize() { window.BOP_APP.updateClient(id, { status: "authorized", authState: "Авторизован" }); window.BOP_APP.toast("Аккаунт авторизован в демо-режиме"); render(); }
        render();
        var focus = new URLSearchParams(window.location.search).get("focus");
        if (focus === "action") window.setTimeout(function () { var target = document.getElementById("current-action"); if (target) target.scrollIntoView({ behavior: "smooth", block: "center" }); }, 80);
      })();
    </script>
    <script>
      (function () {
        var M = window.BOP_MOCK, id = new URLSearchParams(window.location.search).get("id") || "CL-1042";
        var client = window.BOP_APP.clients().find(function (item) { return item.id === id; }) || window.BOP_APP.clients()[0];
        var form = document.getElementById("client-form");
        if (!client || !form) return;
        var passportCard = form.querySelectorAll("article")[1];
        var passportRow = passportCard.querySelector(".row");
        passportRow.insertAdjacentHTML("beforeend", '<div class="col-md-6"><label class="form-label">Дата выдачи</label><input class="form-control" name="passportIssued" value="' + window.BOP_APP.escapeHtml(client.passportIssued || "01.05.2022") + '" /></div>');
        var side = document.querySelector(".col-lg-4");
        var accountCard = side.querySelectorAll(".card")[0];
        accountCard.querySelector(".card-body").insertAdjacentHTML("beforeend", '<hr class="my-3"><div class="bop-section-label">Учётные данные аккаунта</div><div class="mt-2"><div class="d-flex justify-content-between"><span>Логин</span><strong>' + window.BOP_APP.escapeHtml(client.accountLogin || client.email || "не указан") + '</strong></div><div class="d-flex justify-content-between mt-2"><span>Пароль</span><strong>••••••••</strong></div><div class="d-flex justify-content-between mt-2"><span>Сессия</span><strong>' + window.BOP_APP.escapeHtml(client.accountSession || client.authState || "не сохранена") + '</strong></div><div class="d-flex justify-content-between mt-2"><span>Браузер</span><strong>' + window.BOP_APP.escapeHtml(client.browser || "Browser Manager") + '</strong></div></div>');
        var event = (M.EVENTS || []).find(function (item) { return item.clientId === client.id && item.level === "action"; });
        side.insertAdjacentHTML("beforeend", '<article class="card mt-3"><div class="card-header"><h3 class="card-title">Журнал ошибок</h3></div><div class="card-body">' + (event ? '<div class="text-red fw-semibold">' + window.BOP_APP.escapeHtml(event.message) + '</div><div class="text-secondary small mt-1">ID ошибки: ' + window.BOP_APP.escapeHtml(event.errorId || "—") + ' · источник: ' + window.BOP_APP.escapeHtml(event.source || "System") + '</div>' : '<div class="text-green"><i class="ti ti-circle-check me-1"></i>Ошибок по карточке нет</div>') + '</div></article>');
      })();
    </script>
  </body>
</html>
