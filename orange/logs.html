<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="Расширенный журнал событий Booking Ops." /><title>Журнал событий — Booking Ops</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/core@1.0.0-beta20/dist/css/tabler.min.css" /><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.47.0/tabler-icons.min.css" /><link rel="stylesheet" href="assets/style.css" />

  <body data-page="logs" data-title="Журнал событий">
    <div class="page"><aside class="navbar navbar-vertical navbar-expand-lg navbar-dark" data-bs-theme="dark"><div class="container-fluid"><button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#sidebar-menu" aria-label="Открыть меню"><span class="navbar-toggler-icon"></span></button><div class="collapse navbar-collapse" id="sidebar-menu"><div id="bop-sidebar"></div></div></div></aside><div class="page-wrapper"><header class="navbar navbar-expand-md d-none d-md-flex d-print-none bop-topbar"><div class="container-xl" id="bop-topbar"></div></header>
      <main class="page-body"><div class="container-xl"><div class="d-flex justify-content-between align-items-center mb-3"><div><div class="text-secondary small">Аудит действий и событий системы</div><div class="bop-page-note">Фильтры по клиенту, стране, периоду, типу, результату и критичности</div></div><button class="btn btn-outline-secondary btn-sm" id="logs-export"><i class="ti ti-download me-1"></i>Экспорт журнала</button></div><article class="card"><div class="bop-toolbar"><div class="row g-2 align-items-center"><div class="col-sm-6 col-lg-auto"><select class="form-select" id="log-client"><option value="all">Все клиенты</option></select></div><div class="col-sm-6 col-lg-auto"><select class="form-select" id="log-country"><option value="all">Все страны</option><option value="ES">Испания</option><option value="FR">Франция</option><option value="IT">Италия</option></select></div><div class="col-sm-6 col-lg-auto"><select class="form-select" id="log-period"><option value="all">Весь период</option><option value="today">Сегодня</option><option value="week">Последние 7 дней</option></select></div><div class="col-sm-6 col-lg-auto"><select class="form-select" id="log-type"><option value="all">Все типы</option><option value="slot_found">Найден слот</option><option value="booking_started">Начало записи</option><option value="captcha">CAPTCHA</option><option value="payment">Оплата</option><option value="booked">Запись</option><option value="retry">Повтор</option><option value="error">Ошибка</option><option value="check">Проверка</option><option value="paused">Пауза</option></select></div><div class="col-sm-6 col-lg-auto"><select class="form-select" id="log-result"><option value="all">Все результаты</option><option>Успех</option><option>Ожидание</option><option>Ошибка</option></select></div><div class="col-sm-6 col-lg-auto"><select class="form-select" id="log-criticality"><option value="all">Любая критичность</option><option>Высокая</option><option>Средняя</option><option>Низкая</option></select></div><div class="col-lg"><div class="input-icon"><span class="input-icon-addon"><i class="ti ti-search"></i></span><input class="form-control" id="log-search" placeholder="Поиск по описанию, источнику или ID ошибки" /></div></div></div></div><div class="table-responsive"><table class="table bop-table table-vcenter card-table"><thead><tr><th>Время</th><th>ID события</th><th>Клиент</th><th>Страна</th><th>Источник</th><th>Тип</th><th>Результат</th><th>Критичность</th><th>ID ошибки</th><th>Описание</th></tr></thead><tbody id="logs-body"></tbody></table></div><div id="logs-empty" class="bop-empty d-none"><i class="ti ti-search-off icon"></i><strong>События не найдены</strong></div><div class="card-footer text-secondary small" id="logs-total"></div></article></div></main><footer class="footer footer-transparent d-print-none"><div class="container-xl text-secondary small">Booking Ops · журнал событий · демо-данные</div></footer></div></div>
    <script src="https://cdn.jsdelivr.net/npm/@tabler/core@1.0.0-beta20/dist/js/tabler.min.js"></script><script src="assets/mock-data.js"></script><script src="assets/layout.js"></script><script src="assets/app.js"></script><script>
       (function () { var M = window.BOP_MOCK, events = window.BOP_APP.events(), body = document.getElementById("logs-body"), controls = ["log-client", "log-country", "log-period", "log-type", "log-result", "log-criticality"].map(function (id) { return document.getElementById(id); }), search = document.getElementById("log-search"), empty = document.getElementById("logs-empty"); window.BOP_APP.clients().forEach(function (client) { document.getElementById("log-client").insertAdjacentHTML("beforeend", '<option value="' + window.BOP_APP.escapeHtml(client.id) + '">' + window.BOP_APP.escapeHtml(client.id + " · " + client.name) + "</option>"); }); var clientParam = new URLSearchParams(window.location.search).get("client"); if (clientParam) document.getElementById("log-client").value = clientParam;
         function render() { var q = search.value.toLowerCase().trim(), rows = events.filter(function (event) { var result = event.result || (event.level === "action" ? "Ожидание" : event.level === "success" ? "Успех" : "Инфо"), criticality = event.criticality || "Низкая", age = Number(event.ageDays || 0), periodHit = controls[2].value === "all" || (controls[2].value === "today" ? age === 0 : age <= 7); return (controls[0].value === "all" || event.clientId === controls[0].value) && (controls[1].value === "all" || event.country === controls[1].value) && periodHit && (controls[3].value === "all" || event.type === controls[3].value) && (controls[4].value === "all" || result === controls[4].value) && (controls[5].value === "all" || criticality === controls[5].value) && (event.id + " " + event.client + " " + event.message + " " + (event.source || "") + " " + (event.errorId || "")).toLowerCase().indexOf(q) !== -1; }); body.innerHTML = rows.map(function (event) { var result = event.result || (event.level === "action" ? "Ожидание" : event.level === "success" ? "Успех" : "Инфо"), criticality = event.criticality || "Низкая"; return '<tr><td class="text-secondary">' + window.BOP_APP.escapeHtml(event.time) + '</td><td class="text-secondary">' + window.BOP_APP.escapeHtml(event.id) + '</td><td><a href="client-card.html?id=' + encodeURIComponent(event.clientId) + '" class="bop-client-name text-reset">' + window.BOP_APP.escapeHtml(event.client) + '</a></td><td>' + M.countryName(event.country) + '</td><td class="text-secondary">' + window.BOP_APP.escapeHtml(event.source || "System") + '</td><td>' + M.eventBadge(event.level) + '</td><td><span class="badge bg-' + (result === "Ошибка" ? "red" : result === "Успех" ? "green" : "secondary") + '-lt">' + window.BOP_APP.escapeHtml(result) + '</span></td><td>' + window.BOP_APP.escapeHtml(criticality) + '</td><td class="text-secondary">' + window.BOP_APP.escapeHtml(event.errorId || "—") + '</td><td>' + window.BOP_APP.escapeHtml(event.message) + '</td></tr>'; }).join(""); empty.classList.toggle("d-none", rows.length > 0); document.getElementById("logs-total").textContent = "Показано событий: " + rows.length; }
         controls.forEach(function (input) { input.addEventListener("change", render); }); search.addEventListener("input", render); document.getElementById("logs-export").addEventListener("click", function () { var data = events.map(function (event) { return [event.id, event.time, event.client, event.country, event.source || "System", event.message].map(function (value) { return '"' + String(value).replace(/"/g, '""') + '"'; }).join(";"); }).join("\\n"); var link = document.createElement("a"); link.href = URL.createObjectURL(new Blob(["\\ufeff" + data], { type: "text/csv;charset=utf-8" })); link.download = "booking-ops-log.csv"; link.click(); window.setTimeout(function () { URL.revokeObjectURL(link.href); }, 0); window.BOP_APP.toast("Журнал экспортирован"); }); render();
      })();
    </script>
