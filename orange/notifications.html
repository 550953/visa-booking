<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="Уведомления Booking Ops по событиям записи." /><title>Уведомления — Booking Ops</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/core@1.0.0-beta20/dist/css/tabler.min.css" /><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.47.0/tabler-icons.min.css" /><link rel="stylesheet" href="assets/style.css" />
  </head>
  <body data-page="notifications" data-title="Уведомления">
    <div class="page"><aside class="navbar navbar-vertical navbar-expand-lg navbar-dark" data-bs-theme="dark"><div class="container-fluid"><button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#sidebar-menu" aria-label="Открыть меню"><span class="navbar-toggler-icon"></span></button><div class="collapse navbar-collapse" id="sidebar-menu"><div id="bop-sidebar"></div></div></div></aside><div class="page-wrapper"><header class="navbar navbar-expand-md d-none d-md-flex d-print-none bop-topbar"><div class="container-xl" id="bop-topbar"></div></header>
      <main class="page-body"><div class="container-xl"><div class="d-flex justify-content-between align-items-center mb-3 gap-3 flex-wrap"><div><div class="text-secondary small" id="unread-label">—</div><div class="bop-page-note">Telegram — основной канал; здесь оператор видит все контрольные точки процесса</div></div><div class="btn-list"><select class="form-select form-select-sm" id="notice-filter"><option value="all">Все уведомления</option><option value="action">Требуют действия</option><option value="info">Информационные</option></select><button class="btn btn-outline-secondary btn-sm" id="mark-all"><i class="ti ti-checks me-1"></i>Отметить всё прочитанным</button></div></div><article class="card"><div class="list-group list-group-flush" id="notifications-list"></div></article></div></main><footer class="footer footer-transparent d-print-none"><div class="container-xl text-secondary small">Booking Ops · уведомления · демо-данные</div></footer></div></div>
    <script src="https://cdn.jsdelivr.net/npm/@tabler/core@1.0.0-beta20/dist/js/tabler.min.js"></script><script src="assets/mock-data.js"></script><script src="assets/layout.js"></script><script src="assets/app.js"></script><script>
       (function () { var M = window.BOP_MOCK, notifications = window.BOP_APP.notifications(), list = document.getElementById("notifications-list"), filter = document.getElementById("notice-filter"); function render() { var rows = notifications.filter(function (item) { return filter.value === "all" || item.type === filter.value; }); document.getElementById("unread-label").textContent = notifications.filter(function (item) { return !item.read; }).length + " непрочитанных уведомления"; list.innerHTML = rows.map(function (item) { var target = item.title.indexOf("—") !== -1 ? item.title.split("—")[1].trim() : ""; var client = M.CLIENTS.find(function (c) { return target && c.name.indexOf(target) !== -1; }); var action = item.action || "Открыть карточку"; return '<div class="list-group-item ' + (item.read ? "" : "bg-orange-lt") + '"><div class="d-flex gap-3"><span class="avatar avatar-sm ' + (item.type === "action" ? "bg-red-lt text-red" : "bg-azure-lt text-azure") + '"><i class="ti ti-' + (item.type === "action" ? "alert-triangle" : "info-circle") + '"></i></span><div class="flex-fill"><div class="d-flex justify-content-between gap-2"><strong>' + window.BOP_APP.escapeHtml(item.title) + '</strong><span class="text-secondary small">' + window.BOP_APP.escapeHtml(item.time) + '</span></div><div class="text-secondary small mt-1">' + window.BOP_APP.escapeHtml(item.body) + '</div><div class="btn-list mt-2"><button class="btn btn-link btn-sm px-0" data-read="' + window.BOP_APP.escapeHtml(item.id) + '">' + (item.read ? "Прочитано" : "Отметить прочитанным") + '</button>' + (client ? '<a class="btn btn-sm btn-outline-orange" href="client-card.html?id=' + encodeURIComponent(client.id) + '&focus=action">' + window.BOP_APP.escapeHtml(action) + '</a>' : "") + '</div></div></div></div>'; }).join(""); list.querySelectorAll("[data-read]").forEach(function (button) { button.addEventListener("click", function () { var item = notifications.find(function (row) { return row.id === button.dataset.read; }); if (!item) return; item.read = true; window.BOP_APP.saveNotifications(notifications); render(); window.BOP_APP.toast("Уведомление отмечено прочитанным"); }); }); } filter.addEventListener("change", render); document.getElementById("mark-all").addEventListener("click", function () { notifications.forEach(function (item) { item.read = true; }); window.BOP_APP.saveNotifications(notifications); render(); window.BOP_APP.toast("Все уведомления отмечены прочитанными"); }); render(); })();
    </script>
  </body>
</html>
